<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .box-arc { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 8px; }
      .box-mutex { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8px; }
      .title { font-size: 14px; font-weight: bold; fill: #1e293b; }
      .text { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .code { font-family: monospace; font-weight: 600; fill: #991b1b; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="700" height="240" class="bg" />

  <!-- Arc Wrapper -->
  <rect x="40" y="30" width="300" height="170" class="box-arc" />
  <text x="60" y="60" class="title" font-weight="600">Arc&lt;T&gt; (Contador Atómico)</text>
  <text x="60" y="90" class="text" font-weight="600">Comparte punteros seguros entre hilos</text>
  <text x="60" y="125" class="text" font-weight="600">• Hilo A apunta al recurso</text>
  <text x="60" y="150" class="text" font-weight="600">• Hilo B apunta al recurso</text>

  <!-- Mutex Wrapper -->
  <rect x="380" y="30" width="280" height="170" class="box-mutex" />
  <text x="400" y="60" class="title" font-weight="600">Mutex&lt;T&gt; (Exclusión Mutua)</text>
  <text x="400" y="90" class="text" font-weight="600">Protege el valor interior</text>
  <text x="400" y="125" class="text" font-weight="600">• Da llave de acceso a UNO a la vez</text>
  <text x="400" y="150" class="text" font-weight="600">• Evita corrupciones de memoria</text>
</svg>