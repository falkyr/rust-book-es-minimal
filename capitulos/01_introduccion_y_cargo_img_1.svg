<svg viewBox="0 0 700 220" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background: #f8fafc; border-radius: 8px; border: 1px solid #cbd5e1; font-family: system-ui, sans-serif;">
  <!-- JS / GC -->
  <rect x="30" y="30" width="190" height="160" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="60" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold">JavaScript (GC)</text>
  <text x="50" y="95" fill="#0f172a" font-size="12" font-weight="600">• El motor limpia solo</text>
  <text x="50" y="125" fill="#0f172a" font-size="12" font-weight="600">• Pausas sorpresa</text>
  <text x="50" y="155" fill="#0f172a" font-size="12" font-weight="600">• Alto consumo RAM</text>

  <!-- C / Manual -->
  <rect x="255" y="30" width="190" height="160" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="60" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">C / C++ (Manual)</text>
  <text x="275" y="95" fill="#0f172a" font-size="12" font-weight="600">• Control total</text>
  <text x="275" y="125" fill="#0f172a" font-size="12" font-weight="600">• Fugas de memoria</text>
  <text x="275" y="155" fill="#0f172a" font-size="12" font-weight="600">• Crashes peligrosos</text>

  <!-- Rust / Ownership -->
  <rect x="480" y="30" width="190" height="160" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="575" y="60" text-anchor="middle" fill="#065f46" font-size="14" font-weight="bold">Rust (Ownership)</text>
  <text x="500" y="95" fill="#0f172a" font-size="12" font-weight="600">• Cero Garbage Collector</text>
  <text x="500" y="125" fill="#0f172a" font-size="12" font-weight="600">• Seguridad estática</text>
  <text x="500" y="155" fill="#0f172a" font-size="12" font-weight="600">• Velocidad nativa pura</text>
</svg>