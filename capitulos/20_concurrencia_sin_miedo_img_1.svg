<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .box-main { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8px; }
      .box-thread { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 8px; }
      .title { font-size: 15px; font-weight: bold; fill: #1e293b; }
      .text { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .code { font-family: monospace; font-size: 12px; font-weight: 600; fill: #1e40af; }
      .arrow { stroke: #ef4444; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Fondo general -->
  <rect width="700" height="280" class="bg" />

  <!-- Hilo Principal -->
  <rect x="30" y="30" width="300" height="210" class="box-main" />
  <text x="50" y="60" class="title" font-weight="600">Hilo Principal (Main Thread)</text>
  <text x="50" y="95" class="text" font-weight="600">Crea variable: <tspan class="code">let s = String::from("Hola")</tspan></text>
  <text x="50" y="130" class="text" font-weight="600">Ejecuta: <tspan class="code">thread::spawn(move ||)</tspan></text>
  <text x="50" y="180" style="font-size: 12px; fill: #991b1b; font-weight: bold;">[Ownership se transfiere]</text>

  <!-- Flecha de Movimiento -->
  <path d="M 340 135 L 390 135" class="arrow" />
  <text x="350" y="120" style="font-size: 11px; font-weight: bold; fill: #991b1b;">move</text>

  <!-- Hilo Secundario -->
  <rect x="410" y="30" width="260" height="210" class="box-thread" />
  <text x="430" y="60" class="title" font-weight="600">Hilo Secundario</text>
  <text x="430" y="95" class="text" font-weight="600">Recibe la propiedad de <tspan class="code">s</tspan></text>
  <text x="430" y="130" class="text" font-weight="600">La usa de forma segura</text>
  <text x="430" y="180" style="font-size: 12px; fill: #047857; font-weight: bold;">[Libera memoria al morir]</text>
</svg>