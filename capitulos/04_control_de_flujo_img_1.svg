<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #eff6ff; border-radius: 12px; font-family: sans-serif;">
  <!-- Fondo y contenedor principal -->
  <rect x="20" y="20" width="560" height="160" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  
  <!-- Rama Condición -->
  <rect x="40" y="50" width="160" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">if tengo_hambre</text>
  <text x="120" y="100" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="600">Evalúa verdadero</text>
  <text x="120" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Devuelve: "Pizza"</text>

  <!-- Flecha -->
  <path d="M 210 100 L 260 100" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Variable resultado -->
  <rect x="270" y="70" width="90" height="60" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="315" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">let comida</text>
  <text x="315" y="115" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">= "Pizza"</text>

  <!-- Definición de flecha -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>