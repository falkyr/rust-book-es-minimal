<svg viewBox="0 0 700 180" width="100%" height="180" style="background-color: #f8fafc; border-radius: 12px; margin: 20px 0; font-family: system-ui, sans-serif;">
  <text x="35" y="35" fill="#1e293b" font-size="16" font-weight="bold">Anatomía de un Slice en Memoria (&amp;[i32])</text>
  
  <!-- Bloques de datos -->
  <rect x="35" y="60" width="100" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="55" y="88" fill="#0369a1" font-size="13" font-weight="bold">DATA PTR</text>
  <text x="60" y="112" fill="#0f172a" font-size="14" font-weight="600">0x7ffee...</text>

  <rect x="145" y="60" width="100" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="170" y="88" fill="#0369a1" font-size="13" font-weight="bold">LENGTH</text>
  <text x="185" y="112" fill="#0f172a" font-size="14" font-weight="600">3</text>

  <!-- Nota explicativa -->
  <rect x="280" y="60" width="385" height="70" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="88" fill="#0f172a" font-size="14" font-weight="600">Tamaño fijo de 16 bytes en la pila (Stack).</text>
  <text x="300" y="112" fill="#475569" font-size="13" font-weight="600">Independiente de cuántos elementos tenga el array.</text>
</svg>