<svg viewBox="0 0 700 280" width="100%" height="100%" style="background: #f8fafc; border-radius: 12px; font-family: system-ui, sans-serif; padding: 10px;">
  <!-- JS Model -->
  <rect x="30" y="30" width="300" height="210" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="65" font-size="16" font-weight="bold" fill="#1e40af">JavaScript Promise (Push)</text>
  <text x="50" y="95" font-size="13" font-weight="600" fill="#0f172a">1. Creas la promesa</text>
  <text x="50" y="120" font-size="13" font-weight="600" fill="#0f172a">2. Se ejecuta AUTOMÁTICAMENTE</text>
  <text x="50" y="145" font-size="13" font-weight="600" fill="#0f172a">3. Empuja el resultado cuando está</text>
  <circle cx="180" cy="190" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="195" font-size="13" font-weight="bold" fill="#1d4ed8">Corre!</text>

  <!-- Rust Model -->
  <rect x="370" y="30" width="300" height="210" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="65" font-size="16" font-weight="bold" fill="#065f46">Rust Future (Pull / Lazy)</text>
  <text x="390" y="95" font-size="13" font-weight="600" fill="#0f172a">1. Creas el Future</text>
  <text x="390" y="120" font-size="13" font-weight="600" fill="#0f172a">2. NO HACE NADA (Inactivo)</text>
  <text x="390" y="145" font-size="13" font-weight="600" fill="#0f172a">3. El Runtime hace .poll() activamente</text>
  <rect x="490" y="170" width="80" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="510" y="195" font-size="13" font-weight="bold" fill="#065f46">.await</text>
</svg>