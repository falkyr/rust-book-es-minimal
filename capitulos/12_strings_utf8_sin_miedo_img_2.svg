<svg viewBox="0 0 700 210" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background-color: #f8fafc; border-radius: 8px; padding: 10px; font-family: sans-serif;">
  <rect x="20" y="20" width="660" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <text x="40" y="50" font-size="16" font-weight="bold" fill="#1e293b">Caja de Herramientas para Strings en Rust</text>
  
  <!-- Fila 1 -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="180" height="40" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="90" y="25" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">.chars()</text>
    <text x="195" y="25" font-size="12" fill="#334155" font-weight="600">Itera sobre cada caracter Unicode (char).</text>
  </g>

  <!-- Fila 2 -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="180" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <text x="90" y="25" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">format!(...) </text>
    <text x="195" y="25" font-size="12" fill="#334155" font-weight="600">Construye nuevos strings sin gastar ownership.</text>
  </g>
</svg>