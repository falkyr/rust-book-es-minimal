<svg viewBox="0 0 700 220" width="100%" height="220" style="background: #f8fafc; border-radius: 12px; font-family: system-ui, sans-serif;">
  <!-- Propietario -->
  <rect x="50" y="50" width="180" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Propietario original</text>
  <text x="140" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">let libro = Comic;</text>
  <text x="140" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Dueño de los datos</text>

  <!-- Flecha de préstamo -->
  <line x1="230" y1="110" x2="430" y2="110" stroke="#0f172a" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="420,102 440,110 420,118" fill="#0f172a"/>
  <text x="330" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Presta (&amp;)</text>

  <!-- Prestatario -->
  <rect x="440" y="50" width="210" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="545" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Amigo (Referencia)</text>
  <text x="545" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">&amp;comic</text>
  <text x="545" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Solo lectura temporal</text>
</svg>