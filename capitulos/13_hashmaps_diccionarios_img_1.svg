<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="280" fill="#f8fafc" rx="12"/>
  
  <!-- Título -->
  <text x="350" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">HashMap: Clave -> Hash -> Valor en Heap</text>
  
  <!-- Clave de entrada -->
  <rect x="30" y="90" width="100" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="120" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">"rust"</text>
  <text x="80" y="155" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">Clave (Stack)</text>

  <!-- Flecha a Hash -->
  <line x1="135" y1="115" x2="195" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caja de Función Hash -->
  <rect x="200" y="80" width="120" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="260" y="110" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">SipHash</text>
  <text x="260" y="130" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">Función Hash</text>

  <!-- Flecha a Cubeta (Bucket) -->
  <line x1="325" y1="115" x2="385" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Memoria Heap (Buckets) -->
  <rect x="390" y="60" width="280" height="180" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="530" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Memoria Heap (Buckets)</text>

  <rect x="410" y="100" width="240" height="40" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="430" y="125" font-size="12" font-weight="600" fill="#0f172a">Hash: 0x7a... | Valor: 42</text>

  <rect x="410" y="150" width="240" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  <text x="430" y="175" font-size="12" fill="#0f172a" font-weight="600">(Vacío)</text>

  <!-- Definición de marcador de flecha -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>