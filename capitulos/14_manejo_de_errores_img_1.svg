<svg viewBox="0 0 700 280" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background-color: #f8fafc; border-radius: 12px; padding: 16px; font-family: system-ui, sans-serif;">
  <!-- Fondo y Contenedor Principal -->
  <rect x="20" y="20" width="660" height="240" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="45" y="55" font-size="18" font-weight="bold" fill="#1e40af">Anatomía de Result&lt;T, E&gt; y el operador '?'</text>

  <!-- Rama Ok -->
  <rect x="45" y="80" width="280" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="65" y="100" width="100" height="30" rx="6" fill="#dcfce7"/>
  <text x="85" y="120" font-size="14" font-weight="bold" fill="#166534">Ok(T)</text>
  <text x="65" y="155" font-size="13" font-weight="600" fill="#0f172a">¡Operación exitosa!</text>
  <text x="65" y="175" font-size="12" font-weight="600" fill="#334155">El operador '?' extrae</text>
  <text x="65" y="195" font-size="12" font-weight="600" fill="#334155">el valor T automáticamente.</text>

  <!-- Rama Err -->
  <rect x="365" y="80" width="290" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="385" y="100" width="100" height="30" rx="6" fill="#fee2e2"/>
  <text x="405" y="120" font-size="14" font-weight="bold" fill="#991b1b">Err(E)</text>
  <text x="385" y="155" font-size="13" font-weight="600" fill="#0f172a">¡Algo salió mal!</text>
  <text x="385" y="175" font-size="12" font-weight="600" fill="#334155">El operador '?' hace return</text>
  <text x="385" y="195" font-size="12" font-weight="600" fill="#334155">temprano del error E.</text>
</svg>