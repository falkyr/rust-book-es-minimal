<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" style="background:#eff6ff; border-radius:12px; width:100%; height:auto; font-family:sans-serif;">
  <!-- Fondo y Contenedor Principal -->
  <rect x="20" y="20" width="200" height="240" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="50" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">Molde Genérico</text>
  <text x="120" y="90" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">fn imprimir&lt;T&gt;(x: T)</text>
  <text x="120" y="130" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Usa comodín &lt;T&gt;</text>
  <text x="120" y="170" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Cero costo en</text>
  <text x="120" y="195" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">tiempo de ejecución</text>

  <!-- Flecha de conversión -->
  <path d="M 230 140 L 290 140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Salidas Monomorfizadas -->
  <rect x="310" y="30" width="360" height="100" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="490" y="60" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Versión Generada para i32</text>
  <text x="490" y="95" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">fn imprimir_i32(x: i32)</text>

  <rect x="310" y="150" width="360" height="100" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="490" y="180" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Versión Generada para String</text>
  <text x="490" y="215" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">fn imprimir_string(x: String)</text>
</svg>