<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="auto" style="background-color: #f8fafc; border-radius: 12px; font-family: system-ui, sans-serif;">
  <!-- Main Thread / Listener -->
  <rect x="30" y="90" width="130" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="125" text-anchor="middle" fill="#1e40af" font-weight="bold" font-size="13">TcpListener</text>

  <!-- Job Queue (Channel) -->
  <rect x="200" y="80" width="100" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" fill="#991b1b" font-weight="bold" font-size="13">Canal (mpsc)</text>
  <text x="250" y="135" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Cola de Jobs</text>

  <!-- Worker Threads -->
  <rect x="360" y="30" width="120" height="45" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="58" text-anchor="middle" fill="#065f46" font-weight="bold" font-size="12">Worker Hilo 1</text>

  <rect x="360" y="97" width="120" height="45" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="125" text-anchor="middle" fill="#065f46" font-weight="bold" font-size="12">Worker Hilo 2</text>

  <rect x="360" y="165" width="120" height="45" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="193" text-anchor="middle" fill="#065f46" font-weight="bold" font-size="12">Worker Hilo 3</text>

  <!-- Connections -->
  <path d="M 160 120 L 200 120" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 300 120 L 360 52" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 300 120 L 360 120" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 300 120 L 360 187" fill="none" stroke="#0f172a" stroke-width="2"/>
</svg>