<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; border-radius:12px; font-family:monospace;">
  <text x="350" y="30" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">El Flujo de Ownership y Lifetimes en Structs</text>

  <!-- Caja del Heap (String original) -->
  <rect x="50" y="70" width="240" height="160" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="70" y="100" fill="#3b82f6" font-size="14" font-weight="bold">String en el Heap</text>
  <text x="70" y="130" fill="#f8fafc" font-size="12">let novela = String::from(...)</text>
  <text x="70" y="170" fill="#10b981" font-size="12">"En un lugar de la Mancha..."</text>

  <!-- Caja del Stack (Struct Anuncio) -->
  <rect x="410" y="70" width="240" height="160" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="430" y="100" fill="#f59e0b" font-size="14" font-weight="bold">Struct Anuncio&lt;'a&gt;</text>
  <text x="430" y="130" fill="#f8fafc" font-size="12">contenido: &amp;'a str</text>
  
  <!-- Puntero / Flecha -->
  <path d="M 410 150 L 290 150" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="315" y="140" fill="#ef4444" font-size="11">Apunta a (&amp;)</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>