<svg viewBox="0 0 700" width="700" height="240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="240" fill="#f8fafc" rx="12"/>
  
  <text x="350" y="30" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Flujo de entry() y or_insert()</text>

  <!-- Paso 1 -->
  <rect x="30" y="70" width="180" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="95" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">1. .entry("key")</text>
  <text x="120" y="125" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">Busca la clave en</text>
  <text x="120" y="145" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">el HashMap</text>

  <line x1="210" y1="125" x2="255" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Paso 2 -->
  <rect x="260" y="70" width="180" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="95" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">2. .or_insert(val)</text>
  <text x="350" y="125" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">Si no existe, la crea</text>
  <text x="350" y="145" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">con 'val'</text>

  <line x1="440" y1="125" x2="485" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Paso 3 -->
  <rect x="490" y="70" width="180" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="580" y="95" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">3. Modificación</text>
  <text x="580" y="125" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">Devuelve mutable</text>
  <text x="580" y="145" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">para actualizar</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>