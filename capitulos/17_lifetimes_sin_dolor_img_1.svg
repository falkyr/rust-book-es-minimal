<svg viewBox="0 0 700 280" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background: #f8fafc; font-family: system-ui, sans-serif;">
  <!-- Fondo y Contenedores -->
  <rect x="30" y="30" width="300" height="210" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="370" y="30" width="300" height="210" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>

  <!-- Textos de Cabecera -->
  <text x="50" y="65" font-size="16" font-weight="bold" fill="#1e40af">Scope A (Propietario)</text>
  <text x="390" y="65" font-size="16" font-weight="bold" fill="#991b1b">Scope B (Referencia)</text>

  <!-- Barras de Tiempo -->
  <rect x="50" y="90" width="260" height="40" rx="6" fill="#dbeafe"/>
  <text x="70" y="115" font-size="14" font-weight="600" fill="#0f172a">let x = String::from("hola");</text>

  <rect x="50" y="150" width="180" height="40" rx="6" fill="#fee2e2"/>
  <text x="70" y="175" font-size="14" font-weight="600" fill="#0f172a">let r = &amp;x; ('a)</text>

  <!-- Intento inválido -->
  <line x1="230" y1="170" x2="330" y2="170" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,6"/>
  <text x="390" y="120" font-size="14" font-weight="bold" fill="#991b1b">¡Peligro!</text>
  <text x="390" y="145" font-size="13" font-weight="600" fill="#0f172a">Si 'r' sobrevive a 'x',</text>
  <text x="390" y="165" font-size="13" font-weight="600" fill="#0f172a">el compilador explota.</text>
</svg>