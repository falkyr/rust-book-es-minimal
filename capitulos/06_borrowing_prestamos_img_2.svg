<svg viewBox="0 0 700 250" width="100%" height="250" style="background: #f8fafc; border-radius: 12px; font-family: system-ui, sans-serif;">
  <!-- Caso Correcto -->
  <rect x="40" y="30" width="280" height="180" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="180" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">PERMITIDO</text>
  <text x="180" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">&amp; Lectores múltiples</text>
  <text x="180" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Amigo 1 lee el dato</text>
  <text x="180" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Amigo 2 lee el mismo dato</text>
  <text x="180" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">¡Sin conflictos de lectura!</text>

  <!-- Caso Prohibido -->
  <rect x="380" y="30" width="280" height="180" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="520" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">PROHIBIDO</text>
  <text x="520" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">&amp; Lector + &amp;mut Escritor</text>
  <text x="520" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Alguien lee mientras</text>
  <text x="520" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">otro intenta modificar</text>
  <text x="520" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">¡Pánico de datos evitado!</text>
</svg>