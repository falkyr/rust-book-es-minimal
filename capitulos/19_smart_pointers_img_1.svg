<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <!-- Fondo General -->
  <rect width="100%" height="100%" fill="#eff6ff" rx="12"/>
  
  <!-- Título -->
  <text x="350" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">Cómo funciona Box&lt;T&gt; en la Memoria</text>

  <!-- Sección Stack -->
  <rect x="50" y="60" width="260" height="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="180" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">STACK (Rápido, Fijo)</text>
  
  <rect x="70" y="110" width="220" height="40" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="85" y="135" font-family="monospace" font-size="14" font-weight="600" fill="#0f172a">variable: Box&lt;i32&gt;</text>
  
  <rect x="70" y="165" width="220" height="55" fill="#fef3c7" stroke="#f59e0b" rx="4"/>
  <text x="85" y="188" font-family="monospace" font-size="13" font-weight="600" fill="#0f172a">Puntero (Dirección)</text>
  <text x="85" y="206" font-family="monospace" font-size="12" font-weight="600" fill="#78350f">Tamaño: 8 bytes</text>

  <!-- Flecha de Puntero -->
  <path d="M 290 192 L 400 150" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Sección Heap -->
  <rect x="400" y="60" width="250" height="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="525" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">HEAP (Dinámico)</text>

  <rect x="420" y="115" width="210" height="85" fill="#d1fae5" stroke="#10b981" rx="6"/>
  <text x="525" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Dato real en memoria</text>
  <text x="525" y="175" font-family="monospace" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">5000</text>

  <!-- Definición de Flecha -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>