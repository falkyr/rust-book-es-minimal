<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Fondo limpio y suave -->
  <rect width="700" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Título -->
  <text x="350" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Cómo Rust clasifica los Closures según su Entorno</text>

  <!-- Caja Stack (Entorno) -->
  <rect x="40" y="70" width="180" height="200" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Stack (Variables)</text>
  <text x="60" y="130" font-size="13" font-weight="600" fill="#0f172a">let x = 10;</text>
  <text x="60" y="160" font-size="13" font-weight="600" fill="#0f172a">let mut y = 20;</text>
  <text x="60" y="190" font-size="13" font-weight="600" fill="#0f172a">let texto = "Hola";</text>

  <!-- Flechas de captura -->
  <path d="M 220 130 Q 310 130 380 110" fill="none" stroke="#64748b" stroke-dasharray="4" stroke-width="2"/>
  <path d="M 220 160 Q 310 160 380 180" fill="none" stroke="#64748b" stroke-dasharray="4" stroke-width="2"/>
  <path d="M 220 190 Q 310 230 380 250" fill="none" stroke="#64748b" stroke-dasharray="4" stroke-width="2"/>

  <!-- Cajas Traits de Closures -->
  <rect x="390" y="80" width="270" height="55" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="405" y="105" font-size="13" font-weight="bold" fill="#065f46">trait Fn (&amp;T)</text>
  <text x="405" y="123" font-size="11" font-weight="600" fill="#0f172a">Préstamo inmutable. Seguro y repetible.</text>

  <rect x="390" y="150" width="270" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="405" y="175" font-size="13" font-weight="bold" fill="#b45309">trait FnMut (&amp;mut T)</text>
  <text x="405" y="193" font-size="11" font-weight="600" fill="#0f172a">Préstamo mutable. Modifica variables.</text>

  <rect x="390" y="220" width="270" height="55" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="405" y="245" font-size="13" font-weight="bold" fill="#991b1b">trait FnOnce (T)</text>
  <text x="405" y="263" font-size="11" font-weight="600" fill="#0f172a">Consume el valor. Se ejecuta una vez.</text>
</svg>