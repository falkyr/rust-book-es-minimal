<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Fondo limpio y suave -->
  <rect width="100%" height="100%" fill="#eff6ff" rx="12"/>
  
  <!-- Título -->
  <text x="350" y="35" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">Arquitectura del ThreadPool en Rust</text>

  <!-- TcpListener -->
  <rect x="30" y="110" width="110" height="90" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="85" y="145" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">TcpListener</text>
  <text x="85" y="165" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Recibe Petición</text>

  <!-- Flecha a Cola -->
  <line x1="140" y1="155" x2="200" y2="155" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Cola / Canal (Channel) -->
  <rect x="200" y="100" width="120" height="110" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="260" y="135" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">mpsc Channel</text>
  <text x="260" y="155" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Cola de Tareas</text>
  <text x="260" y="175" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(Job Receiver)</text>

  <!-- Flechas a Workers -->
  <line x1="320" y1="130" x2="420" y2="85" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="155" x2="420" y2="155" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="180" x2="420" y2="225" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Workers -->
  <g transform="translate(420, 60)">
    <rect width="110" height="50" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="55" y="30" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Worker 1</text>
  </g>
  <g transform="translate(420, 130)">
    <rect width="110" height="50" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="55" y="30" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Worker 2</text>
  </g>
  <g transform="translate(420, 200)">
    <rect width="110" height="50" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="55" y="30" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Worker 3</text>
  </g>

  <!-- Definición de punta de flecha -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>