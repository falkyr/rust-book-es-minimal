<svg viewBox="0 0 700 280" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: #f8fafc; border-radius: 12px; font-family: system-ui, sans-serif;">
  <!-- Referencias en Stack -->
  <rect x="30" y="40" width="180" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="45" y="65" font-size="14" font-weight="bold" fill="#1e40af">Rc original</text>
  <text x="45" y="95" font-size="12" font-weight="600" fill="#0f172a">Apuntador A</text>

  <rect x="30" y="150" width="180" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="45" y="175" font-size="14" font-weight="bold" fill="#1e40af">Rc clonado</text>
  <text x="45" y="205" font-size="12" font-weight="600" fill="#0f172a">Apuntador B</text>

  <!-- Flechas -->
  <path d="M 210 85 C 280 85, 280 140, 350 140" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>
  <path d="M 210 195 C 280 195, 280 150, 350 150" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>

  <!-- Heap Object -->
