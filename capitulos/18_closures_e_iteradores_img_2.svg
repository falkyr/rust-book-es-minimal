<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <!-- Fondo -->
  <rect width="700" height="240" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Título -->
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Tubería de Adaptadores de Iteradores (Lazy Evaluation)</text>

  <!-- Origen -->
  <rect x="30" y="90" width="100" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">vec![1, 2, 3]</text>
  <text x="80" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Fuente</text>

  <!-- Flecha 1 -->
  <path d="M 135 120 L 175 120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Adaptador Map -->
  <rect x="180" y="90" width="110" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="235" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">.map(|x| x * 2)</text>
  <text x="235" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Transforma</text>

  <!-- Flecha 2 -->
  <path d="M 295 120 L 335 120" stroke="#64748b" stroke-width="2"/>

  <!-- Adaptador Filter -->
  <rect x="340" y="90" width="110" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="395" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">.filter(|x| ...)</text>
  <text x="395" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Filtra datos</text>

  <!-- Flecha 3 -->
  <path d="M 455 120 L 495 120" stroke="#64748b" stroke-width="2"/>

  <!-- Consumidor -->
  <rect x="500" y="80" width="170" height="80" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="585" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">.sum() / .collect()</text>
  <text x="585" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Consumidor (Ejecuta)</text>
  <text x="585" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Activa la tubería</text>

  <!-- Nota al pie -->
  <text x="350" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">💡 Ningún cálculo ocurre hasta que el consumidor llama al iterador.</text>
</svg>