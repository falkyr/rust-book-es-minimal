<svg viewBox="0 0 700 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box-title { font-family: monospace; font-size: 13px; fill: #ffffff; font-weight: bold; }
    .box-desc { font-family: sans-serif; font-size: 11px; fill: #cbd5e1; }
  </style>
  
  <rect width="700" height="180" fill="#0f172a" rx="12"/>

  <!-- Paso 1 -->
  <g transform="translate(30, 30)">
    <rect width="190" height="120" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="15" y="25" class="box-title" fill="#3b82f6">1. STRUCT</text>
    <text x="15" y="55" class="box-desc">Define los datos.</text>
    <text x="15" y="75" class="box-desc">Cero lógica de comportamiento.</text>
    <text x="15" y="95" class="box-desc">Memoria contigua pura.</text>
  </g>

  <!-- Flecha -->
  <text x="235" y="95" fill="#64748b" font-size="20">➔</text>

  <!-- Paso 2 -->
  <g transform="translate(255, 30)">
    <rect width="190" height="120" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
    <text x="15" y="25" class="box-title" fill="#10b981">2. IMPL BLOCK</text>
    <text x="15" y="55" class="box-desc">Añade métodos y funciones.</text>
    <text x="15" y="75" class="box-desc">Usa &amp;self o &amp;mut self.</text>
    <text x="15" y="95" class="box-desc">Constructores `Self::new`.</text>
  </g>

  <!-- Flecha -->
  <text x="460" y="95" fill="#64748b" font-size="20">➔</text>

  <!-- Paso 3 -->
  <g transform="translate(480, 30)">
    <rect width="190" height="120" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <text x="15" y="25" class="box-title" fill="#f59e0b">3. COMPILADOR</text>
    <text x="15" y="55" class="box-desc">Verifica ownership.</text>
    <text x="15" y="75" class="box-desc">Controla mutabilidad.</text>
    <text x="15" y="95" class="box-desc">¡Código rápido y seguro!</text>
  </g>
</svg>