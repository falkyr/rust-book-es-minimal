<svg viewBox="0 0 700 240" width="100%" height="240" style="background-color: #f8fafc; border-radius: 12px; margin: 20px 0; font-family: system-ui, sans-serif;">
  <!-- Fondo Stack vs Heap -->
  <rect x="30" y="30" width="280" height="180" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="60" fill="#1e40af" font-size="16" font-weight="bold">Stack (El Slice)</text>
  
  <rect x="50" y="85" width="240" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="110" fill="#0f172a" font-size="14" font-weight="600">Puntero: *const T</text>
  
  <rect x="50" y="135" width="240" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="160" fill="#0f172a" font-size="14" font-weight="600">Longitud (len): 3</text>

  <!-- Flecha conectora -->
  <path d="M 290 105 L 380 105" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Heap Array Original -->
  <rect x="380" y="30" width="290" height="180" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="60" fill="#065f46" font-size="16" font-weight="bold">Heap / Memoria Original</text>
  
  <rect x="400" y="80" width="55" height="55" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="420" y="113" fill="#0f172a" font-size="18" font-weight="bold">"R"</text>
  
  <rect x="465" y="80" width="55" height="55" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="485" y="113" fill="#0f172a" font-size="18" font-weight="bold">"u"</text>
  
  <rect x="530" y="80" width="55" height="55" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="113" fill="#0f172a" font-size="18" font-weight="bold">"s"</text>

  <rect x="595" y="80" width="55" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="615" y="113" fill="#0f172a" font-size="18" font-weight="bold">"t"</text>
</svg>