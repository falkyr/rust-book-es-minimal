<svg viewBox="0 0 600 180" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:monospace;">
  <text x="30" y="30" fill="#f8fafc" font-size="14" font-weight="bold">FLUJO DE UN ITERADOR PEREZOSO EN RUST</text>
  
  <!-- Cajas de flujo -->
  <rect x="30" y="60" width="100" height="50" rx="6" fill="#3b82f6"/>
  <text x="55" y="90" fill="white" font-size="12">vec![1,2,3]</text>
  
  <path d="M 135 85 L 175 85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="60" width="100" height="50" rx="6" fill="#f59e0b"/>
  <text x="200" y="90" fill="white" font-size="12">.iter().map()</text>

  <path d="M 285 85 L 325 85" stroke="#94a3b8" stroke-width="2"/>

  <rect x="330" y="60" width="100" height="50" rx="6" fill="#f59e0b"/>
  <text x="345" y="90" fill="white" font-size="12">.filter(...)</text>

  <path d="M 435 85 L 475 85" stroke="#94a3b8" stroke-width="2"/>

  <rect x="480" y="60" width="90" height="50" rx="6" fill="#10b981"/>
  <text x="500" y="90" fill="white" font-size="12">.sum()</text>

  <text x="180" y="145" fill="#94a3b8" font-size="11">¡Nada se ejecuta hasta que llega el consumidor (.sum())!</text>
</svg>