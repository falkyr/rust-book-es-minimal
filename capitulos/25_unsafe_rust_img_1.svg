<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  
  <!-- Safe World -->
  <rect x="30" y="40" width="280" height="200" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="50" y="75" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#065f46">Mundo Seguro (Safe Rust)</text>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">- Préstamos validados</text>
  <text x="50" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">- Cero data races</text>
  <text x="50" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">- Punteros nulos imposibles</text>

  <!-- Bridge -->
  <path d="M 320 140 L 380 140" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6,6"/>
  <text x="330" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309">unsafe</text>

  <!-- Unsafe World -->
  <rect x="390" y="40" width="280" height="200" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="410" y="75" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#991b1b">Mundo de Poder (Unsafe)</text>
  <text x="410" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">- Punteros crudos (*T)</text>
  <text x="410" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">- Llamadas C (FFI)</text>
  <text x="410" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">- Mutabilidad global</text>
</svg>