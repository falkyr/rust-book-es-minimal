<svg viewBox="0 0 700 200" width="100%" height="100%" style="font-family: sans-serif; background-color: #0f172a; border-radius: 12px; padding: 10px;">
  <text x="30" y="30" fill="#3b82f6" font-weight="bold" font-size="16">RefCell&lt;T&gt;: El Guardián de Ejecución</text>
  
  <rect x="50" y="60" width="220" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="90" fill="#f59e0b" font-weight="bold" font-size="14">RefCell&lt;T&gt;</text>
  <text x="70" y="120" fill="#f8fafc" font-size="12">borrow()   -> &amp;T (Lectura)</text>
  <text x="70" y="145" fill="#f8fafc" font-size="12">borrow_mut() -> &amp;mut T (Escritura)</text>

  <rect x="350" y="60" width="300" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="370" y="90" fill="#ef4444" font-weight="bold" font-size="14">Regla de Oro en Ejecución (Runtime)</text>
  <text x="370" y="120" fill="#fca5a5" font-size="12">✔ Muchos borrows de lectura simultáneos</text>
  <text x="370" y="145" fill="#fca5a5" font-size="12">❌ 1 borrow_mut si ya hay lecturas = ¡PÁNIC!</text>
</svg>