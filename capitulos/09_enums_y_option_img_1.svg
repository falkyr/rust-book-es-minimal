<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="100%" height="100%">
  <style>
    .box-title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #1e40af; }
    .box-text { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
    .code-text { font-family: monospace; font-size: 12px; font-weight: bold; fill: #334155; }
  </style>

  <!-- Fondo general -->
  <rect width="700" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Columna Izquierda: JavaScript / Null -->
  <rect x="30" y="30" width="300" height="160" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="50" y="60" class="box-title" font-weight="600">JavaScript / TypeScript</text>
  <text x="50" y="90" class="box-text" font-weight="600">El valor puede ser:</text>
  <text x="50" y="120" class="code-text" font-weight="600">let user = { name: "Ana" };</text>
  <text x="50" y="145" class="code-text" font-weight="600">let user = null; // ¡Sorpresa al leer!</text>
  <text x="50" y="170" class="box-text" fill="#991b1b" font-weight="600">Peligro: Crash en runtime.</text>

  <!-- Columna Derecha: Rust / Option -->
  <rect x="370" y="30" width="300" height="160" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="390" y="60" class="box-title" fill="#065f46" font-weight="600">Rust Option&lt;T&gt;</text>
  <text x="390" y="90" class="box-text" font-weight="600">El valor viene envuelto:</text>
  <text x="390" y="120" class="code-text" font-weight="600">Some(User { name: "Ana" })</text>
  <text x="390" y="145" class="code-text" font-weight="600">None // Explícito y seguro</text>
  <text x="390" y="170" class="box-text" fill="#047857" font-weight="600">Seguridad total en compilación.</text>
</svg>