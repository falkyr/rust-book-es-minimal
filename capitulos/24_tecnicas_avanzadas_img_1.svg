<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="auto" style="background: #f8fafc; border-radius: 12px; font-family: system-ui, sans-serif;">
  <!-- Fondo y Estilos -->
  <rect width="700" height="320" fill="#f8fafc" rx="12"/>
  
  <!-- Bloque Izquierdo: Estático -->
  <rect x="30" y="30" width="300" height="260" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="50" y="65" font-size="16" font-weight="bold" fill="#1e40af">Despacho Estático (impl Trait)</text>
  <text x="50" y="95" font-size="13" font-weight="600" fill="#0f172a">- Monomorphization (copias de código)</text>
  <text x="50" y="120" font-size="13" font-weight="600" fill="#0f172a">- Cero coste en runtime</text>
  
  <rect x="50" y="145" width="260" height="45" fill="#dbeafe" rx="6"/>
  <text x="65" y="172" font-size="13" font-weight="bold" fill="#1e3a8a">Vec&lt;T&gt; (Todos del mismo tipo)</text>

  <rect x="50" y="205" width="260" height="65" fill="#bfdbfe" rx="6"/>
  <text x="65" y="230" font-size="12" font-weight="bold" fill="#1e3a8a">Memoria contigua y directa:</text>
  <text x="65" y="250" font-size="11" font-weight="600" fill="#1e3a8a">[ StructA | StructA | StructA ]</text>

  <!-- Bloque Derecho: Dinámico -->
  <rect x="370" y="30" width="300" height="260" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="390" y="65" font-size="16" font-weight="bold" fill="#991b1b">Despacho Dinámico (dyn Trait)</text>
  <text x="390" y="95" font-size="13" font-weight="600" fill="#0f172a">- Fat Pointers (Data + vtable)</text>
  <text x="390" y="120" font-size="13" font-weight="600" fill="#0f172a">- Polimorfismo real en colecciones</text>
  
  <rect x="390" y="145" width="260" height="45" fill="#fee2e2" rx="6"/>
  <text x="405" y="172" font-size="13" font-weight="bold" fill="#7f1d1d">Vec&lt;Box&lt;dyn Trait&gt;&gt;</text>

  <rect x="390" y="205" width="260" height="65" fill="#fecaca" rx="6"/>
  <text x="405" y="230" font-size="12" font-weight="bold" fill="#7f1d1d">Punteros a Heap + vtable:</text>
  <text x="405" y="250" font-size="11" font-weight="600" fill="#7f1d1d">[ PtrA-&gt;Heap | PtrB-&gt;Heap ]</text>
</svg>