<svg viewBox="0 0 700 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background: #f8fafc; border-radius: 12px; padding: 10px; font-family: system-ui, sans-serif;">
  <!-- Fondo de struct -->
  <rect x="40" y="30" width="280" height="180" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="65" fill="#1e40af" font-size="16" font-weight="bold">struct Jugador</text>
  <text x="60" y="105" fill="#0f172a" font-size="14" font-weight="600">nombre: String</text>
  <text x="60" y="135" fill="#0f172a" font-size="14" font-weight="600">vida: u32</text>
  <text x="60" y="165" fill="#0f172a" font-size="14" font-weight="600">activo: bool</text>

  <!-- Flecha -->
  <path d="M 330 120 L 370 120" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Fondo de impl -->
  <rect x="380" y="30" width="280" height="180" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="65" fill="#065f46" font-size="16" font-weight="bold">impl Jugador</text>
  <text x="400" y="105" fill="#0f172a" font-size="14" font-weight="600">fn new(...) -> Self</text>
  <text x="400" y="135" fill="#0f172a" font-size="14" font-weight="600">fn recibir_daño(&amp;mut self)</text>
  <text x="400" y="165" fill="#0f172a" font-size="14" font-weight="600">fn esta_vivo(&amp;self) -> bool</text>

  <!-- Marcador de flecha -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>